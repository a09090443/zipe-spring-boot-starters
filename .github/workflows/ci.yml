name: CI 建置與測試

# 觸發時機：
# - push 到 master 或 develop（分支流程：feature → develop → master）
# - 針對 master / develop 的 Pull Request
# 僅文件異動（doc-site、*.md、llms*.txt）不觸發，避免無關變更耗費 CI。
on:
  push:
    branches: [master, develop]
    paths-ignore:
      - 'doc-site/**'
      - '**/*.md'
      - 'llms.txt'
      - 'llms-full.txt'
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - 'doc-site/**'
      - '**/*.md'
      - 'llms.txt'
      - 'llms-full.txt'
  workflow_dispatch:

permissions:
  contents: read

# 同分支新 push 取消尚在進行的舊 CI，節省資源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 建置並測試（mvn verify）
    runs-on: ubuntu-latest
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # verify 會編譯 7 個 starter、執行全部測試，並由 jacoco 產生覆蓋率報告
      - name: 建置並測試
        run: mvn -B verify

      # 覆蓋率彙整到 Actions 執行頁的 Summary（不影響 gate 成敗）
      - name: 彙整測試覆蓋率
        if: always()
        run: |
          {
            echo "## 測試覆蓋率（行）"
            echo ""
            echo "| 模組 | 行覆蓋率 | 覆蓋/總行數 |"
            echo "|---|---|---|"
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              module="${csv%%/*}"
              awk -F, -v m="$module" 'NR>1{lm+=$8; lc+=$9} END{ tot=lm+lc; if(tot>0) printf "| %s | %.1f%% | %d / %d |\n", m, lc/tot*100, lc, tot; else printf "| %s | — | 無可量測行 |\n", m }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # 保留各模組 HTML 報告，可於執行頁下載逐行檢視
      - name: 上傳覆蓋率報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/target/site/jacoco/'
          if-no-files-found: warn
